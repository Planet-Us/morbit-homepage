<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 변경 | MOrbit</title>
    <meta
      name="description"
      content="버스비서 앱 사용자의 비밀번호 재설정 메일 링크에서 새 비밀번호를 설정하는 페이지입니다."
    />
    <link rel="icon" type="image/png" href="../assets/morbit-mark.png" />
    <link rel="apple-touch-icon" href="../assets/morbit-mark.png" />
    <link rel="stylesheet" href="../styles.css" />
    <script src="./config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./reset-password.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../" aria-label="MOrbit 홈">
        <img class="brand-mark" src="../assets/morbit-mark.png" alt="" width="34" height="34" />
        <span>MOrbit</span>
      </a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="../#products">제품</a>
        <a href="../#company">회사</a>
        <a href="../#contact">문의</a>
        <a href="../privacy/">개인정보처리방침</a>
      </nav>
    </header>

    <main class="policy-layout">
      <section class="policy-hero">
        <p class="eyebrow">PASSWORD RESET</p>
        <h1>버스비서 비밀번호 변경</h1>
        <p>
          비밀번호 재설정 메일의 링크를 통해 접속한 경우, 아래에서 새 비밀번호를 설정할 수 있습니다.
        </p>
      </section>

      <article class="policy-content reset-panel">
        <section>
          <h2>새 비밀번호 설정</h2>
          <p id="reset-status" class="status-message info" role="status">
            비밀번호 재설정 링크를 확인하는 중입니다.
          </p>

          <form id="reset-password-form" class="reset-form" hidden>
            <label for="new-password">새 비밀번호</label>
            <input
              id="new-password"
              name="new-password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="8자 이상 입력"
              required
            />

            <label for="confirm-password">새 비밀번호 확인</label>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="한 번 더 입력"
              required
            />

            <button class="button primary" type="submit">비밀번호 변경</button>
          </form>

          <div class="request-card">
            <p>
              링크가 만료되었거나 오류가 발생하면 버스비서 앱에서 비밀번호 재설정 메일을 다시 요청해주세요.
              계속 문제가 있으면 <a href="mailto:eklee808@gmail.com">eklee808@gmail.com</a>으로 문의할 수 있습니다.
            </p>
          </div>
        </section>
      </article>
    </main>

    <footer class="site-footer">
      <span>© 2026 MOrbit. All rights reserved.</span>
      <a href="../privacy/">개인정보처리방침</a>
      <a href="../delete-account/">계정 삭제 요청</a>
    </footer>
  </body>
</html>
